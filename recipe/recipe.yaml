context:
  version: "2026.9.17"
  # upstream refs: https://github.com/jdx/mise/blob/main/scripts/build-tarball.sh & https://github.com/jdx/mise/blob/main/scripts/build-tarball.ps1
  base_features: native-tls,rustls-native-roots,vfox/vendored-lua
  extra_features: ${{ ",aws-lc-rs" if target_platform == "linux-armv7l" else "" }}
  self_update_msg: "This version of mise was installed from conda-forge, a community-maintained channel of Conda packages. Use your Conda package manager (`conda`, `mamba`, `pixi` etc.) to update mise."
  # profile-guided optimization (cf. https://github.com/jdx/mise/blob/main/scripts/pgo.bash) needs to run the
  # freshly built, instrumented binary, so it's limited to native (non-cross) Unix builds
  use_pgo: ${{ unix and build_platform == host_platform }}
  # post-link optimization via BOLT (cf. https://github.com/jdx/mise/blob/main/scripts/bolt.bash) is only supported
  # by upstream on `linux-64`. It's force-disabled here (hard-coded `false`) because conda-forge doesn't yet ship a
  # package providing `llvm-bolt`, `merge-fdata` & `libbolt_rt_instr.a` (checked 2026-09: no such package exists, cf.
  # https://github.com/conda-forge/llvmdev-feedstock, which doesn't build the `bolt` LLVM subproject). Once such a
  # package becomes available, double-check its name & required files below, then restore the intended condition:
  # `target_platform == "linux-64" and build_platform == host_platform`
  use_bolt: false

package:
  name: mise
  version: ${{ version }}

source:
  url: https://github.com/jdx/mise/archive/refs/tags/v${{ version }}.tar.gz
  sha256: e11d01dabbda75cf718a5e2fc692f2b9452c16c8641f2b014dbcdfeb885dc629

build:
  number: 0
  script:
    env:
      AWS_LC_SYS_CMAKE_BUILDER: ${{ "1" if win else "0" }} # force CMake builder for `aws-lc-sys` native C/C++ code on Windows
      CARGO_PROFILE_RELEASE_LTO: "thin" # `rustc-LLVM` runs out of memory with `fat` LTO
      # BOLT needs the linked binary to retain symbols to work on, so strip only after it has run
      CARGO_PROFILE_RELEASE_STRIP: ${{ "none" if use_bolt else "symbols" }}
      OPENSSL_NO_VENDOR: "1"
      # instruct `cc` crate to use clang-cl natively to compile build-time tools intended to be run on the host when cross-compiling from `win_64`
      # (fixes compilation of `zstd-sys`)
      AR_x86_64_pc_windows_msvc: llvm-lib
      CC_x86_64_pc_windows_msvc: clang-cl
      CXX_x86_64_pc_windows_msvc: clang-cl
    interpreter: nu
    content:
      - let prefix = $env.LIBRARY_PREFIX? | default $env.PREFIX
      # set `LIBCLANG_PATH` for bindgen to find libclang
      # cf. https://github.com/conda-forge/clangdev-feedstock/issues/373 & https://github.com/rust-lang/rust-bindgen/issues/918
      - if: unix
        then: $env.LIBCLANG_PATH = $env.BUILD_PREFIX | path join lib
      - if: win
        then:
          - $env.LIBCLANG_PATH = $env.BUILD_PREFIX | path join Library lib
          # bindgen expects libclang.dll but conda-forge only provides versioned DLLs on Windows, so create a copy
          - let bin_dir = ($env.BUILD_PREFIX)/Library/bin | str replace --all '\' '/'
          - let source_dll = glob ($bin_dir)/libclang-*.dll | first
          - cp $source_dll ($bin_dir)/libclang.dll
      # build main app (using upstream's PGO/BOLT scripts on native Unix builds, cf. `use_pgo`/`use_bolt` above) and
      # generate license data
      - if: use_pgo
        then:
          # `pgo.bash` hard-codes the `llvm-profdata` location inside the rustc sysroot; provide it from `llvm-tools`
          - let sysroot = (^rustc --print sysroot | str trim)
          - 'let rhost = (^rustc -vV | lines | where {|l| $l starts-with "host: "} | first | str replace "host: " "")'
          - let profdata_dir = ($sysroot | path join lib rustlib $rhost bin)
          - let profdata = ($profdata_dir | path join llvm-profdata)
          # `mkdir` is idempotent (like `mkdir -p`): it creates missing parent dirs and doesn't error if
          # `$profdata_dir` already exists, so this is safe to run unconditionally. Nu's `path exists` follows
          # symlinks and reports `false` for a dangling one (verified empirically), so a stale/broken `$profdata`
          # symlink from a prior build also enters this branch; `rm -f` removes that leftover directory entry
          # first, since `ln -s` refuses to overwrite an existing path (even a dangling symlink)
          - if not ($profdata | path exists) {
              mkdir $profdata_dir;
              rm -f $profdata;
              ^ln -s ($env.BUILD_PREFIX | path join bin llvm-profdata) $profdata
            }
          # `pgo.bash` invokes `"$MISE_PGO_BUILD_TOOL" build ...`, so wrap `cargo auditable` in a single executable
          - let pgo_build_tool = ($env.SRC_DIR | path join mise-pgo-build-tool)
          - '"#!/usr/bin/env bash\nexec cargo auditable \"$@\"\n" | save --force $pgo_build_tool'
          - ^chmod +x $pgo_build_tool
          - $env.MISE_PGO_BUILD_TOOL = $pgo_build_tool
          - $env.MISE_PGO_PROFILE = "release" # reuse the `CARGO_PROFILE_RELEASE_*` settings above instead of upstream's `serious` profile
          # the rust compiler activation always sets `CARGO_BUILD_TARGET`, even for native builds, so `pgo.bash` must
          # be told the same target triple to compute the correct build output path
          - $env.MISE_PGO_TARGET = $env.CARGO_BUILD_TARGET
          - if: use_bolt
            then: $env.MISE_BOLT = "1" # makes `pgo.bash` link with `--emit-relocs`, which BOLT requires
          - ^bash scripts/pgo.bash --locked --no-default-features --features=${{ base_features }}${{ extra_features }}
          - let mise_bin = ($env.SRC_DIR | path join target $env.CARGO_BUILD_TARGET release mise)
          - if: use_bolt
            then:
              - ^bash scripts/bolt.bash $mise_bin
              # strip only now, since BOLT needed the symbols kept above
              - ^($env.BUILD_PREFIX | path join bin ($env.CHOST + "-strip")) $mise_bin
          - mkdir ($prefix)/bin
          - cp $mise_bin ($prefix)/bin/mise
        else:
          - cargo auditable install --path=. --root=($prefix) --no-track --locked --bins --no-default-features --features=${{ base_features }}${{ extra_features }}
      - if: win
        then: cargo auditable install --path=crates\mise-shim --root=($prefix) --no-track --locked --bins
      - cargo-bundle-licenses --format=yaml --output=THIRDPARTY.yml
      # write custom `mise self-update` message
      - mkdir ($prefix)/lib
      - echo 'message = "${{ self_update_msg }}"' | save ($prefix)/lib/mise-self-update-instructions.toml
      # copy manpage
      - mkdir ($prefix)/share/man/man1
      - cp man/man1/*.1 ($prefix)/share/man/man1/
      # generate shell completions
      - if: build_platform == host_platform
        then:
          - ^mise completion bash | save --force ($prefix)/share/bash-completion/completions/mise
          - ^mise completion fish | save --force ($prefix)/share/fish/vendor_completions.d/mise.fish
          - ^mise completion zsh  | save --force ($prefix)/share/zsh/site-functions/_mise

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - cargo-auditable
    - cargo-bundle-licenses
    - clang
    - cmake
    - libclang
    - make
    - ninja
    - nushell
    - pkg-config
    - if: use_pgo
      then:
        - bash
        - llvm-tools # provides `llvm-profdata`, symlinked into rustc's sysroot for `scripts/pgo.bash`
    - if: use_bolt
      then:
        # `llvm-bolt` is a placeholder name pending a real conda-forge package (see `use_bolt` above); since
        # `use_bolt` is statically `false`, rattler-build prunes this whole block at render time and never
        # attempts to resolve it — verified via `rattler-build build --render-only` for every `.ci_support` variant
        - llvm-bolt # provides `llvm-bolt`, `merge-fdata` & `libbolt_rt_instr.a` (verify name/availability before enabling `use_bolt` above)
        - binutils  # provides `readelf`
  host:
    - if: linux
      then: openssl

tests:
  - script:
      env:
        MISE_NO_CONFIG: 1
        MISE_OFFLINE: 1
      content:
        - mise help
        - mise version
  - package_contents:
      bin:
        - mise
        - if: win
          then: mise-shim
      files:
        - if: unix
          then:
            - lib/mise-self-update-instructions.toml
            - share/man/man1/mise.1
            - if: build_platform == host_platform
              then:
                - share/bash-completion/completions/mise
                - share/fish/vendor_completions.d/mise.fish
                - share/zsh/site-functions/_mise
        - if: win
          then:
            - Library/lib/mise-self-update-instructions.toml
            - Library/share/man/man1/mise.1
            - if: build_platform == host_platform
              then:
                - Library/share/bash-completion/completions/mise
                - Library/share/fish/vendor_completions.d/mise.fish
                - Library/share/zsh/site-functions/_mise
      strict: true

about:
  summary: mise manages dev tools, env vars, and runs tasks.
  description: |
    `mise` (mise-en-place) is a unified CLI tool designed to simplify and manage local development environments.
    It acts as a polyglot tool version manager, installing and seamlessly switching between versions of various
    development tools (replacing utilities like `asdf`, `nvm`, and `pyenv`). Additionally, it functions as an
    environment variable manager that dynamically loads project-specific env vars based on your current directory
    (replacing `direnv`), and serves as a built-in task runner to define and execute project workflows as a modern
    alternative to `make` or `npm` scripts.
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  homepage: https://mise.jdx.dev/
  repository: https://github.com/jdx/mise

extra:
  recipe-maintainers:
    - salim-b
